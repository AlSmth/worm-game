<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1d1410">
  <title>Червь-Пожиратель</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #1d1410;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    /* только то, что понимают и старые браузеры (п. 1.20): flex вместо grid, четыре стороны вместо inset, max-width вместо min() */
    #game { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
    #game canvas { display: block; flex: none; touch-action: none; outline: none; }
    #loader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      background: #1d1410; transition: opacity .35s ease;
    }
    #loader .bar { width: 60vw; max-width: 360px; height: 22px; border: 4px solid #2b1b17; border-radius: 14px; background: #4a2f1f; overflow: hidden; box-shadow: 0 0 0 3px #6b4a32; }
    #loader i { display: block; width: 0; height: 100%; background: linear-gradient(#ffd25a, #ffb020 60%, #ff9a00); transition: width .15s ease; }
  </style>
  <!-- SDK Яндекс Игр: на платформе скрипт отдаёт сам Яндекс по этому пути (п. 1.1, 1.19.1) -->
  <script src="/sdk.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="loader"><div class="bar"><i id="loaderFill"></i></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
